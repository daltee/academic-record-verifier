<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcript Verification | MUST</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Ambient background shapes -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>

    <div class="page-shell">
        <!-- Glass card -->
        <main class="portal-card">
            <header class="portal-header">
                <!-- Circular glass logo frame -->
                <div class="logo-frame">
                    <img src="images/image.png" alt="MUST Logo" class="portal-logo">
                </div>
                <h1 class="portal-title">Transcript Verification</h1>
                <p class="portal-subtitle">Mbarara University of Science and Technology</p>
            </header>

            <!-- Page tabs -->
            <nav class="tab-headers" aria-label="Portal navigation">
                <a href="index.html" class="tab-link active">Verify Transcript</a>
                <a href="signup.html" class="tab-link">Staff Access</a>
            </nav>

            <section class="form-panel">
                <p class="form-intro">Enter the student registration number and the verification code (or hash) printed on the transcript to check authenticity.</p>

                <form id="verify-form" action="#">
                    <div class="form-group">
                        <label for="reg-number">Registration Number</label>
                        <input type="text" id="reg-number" placeholder="e.g. 2021/BSE/001" autocomplete="off" required>
                    </div>

                    <div class="form-group">
                        <label for="verify-code">Verification Code / Hash</label>
                        <input type="text" id="verify-code" placeholder="Enter code or hash from transcript" autocomplete="off" required>
                    </div>

                    <button type="submit" class="submit-btn">Verify Authenticity</button>
                </form>

                <!-- Result area (shown after verification) -->
                <div id="result-area" class="result-area" hidden>
                    <div id="result-status" class="result-status"></div>
                    <p id="result-message" class="result-message"></p>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            &copy; 2026 Group C | SWE2106 — Anti-Forgery Transcript Verification
        </footer>
    </div>

    <script>
        // Lightweight client-side placeholder (will be replaced by real API calls later)
        document.getElementById('verify-form').addEventListener('submit', function (e) {
            e.preventDefault();

            const reg = document.getElementById('reg-number').value.trim();
            const code = document.getElementById('verify-code').value.trim();
            const resultArea = document.getElementById('result-area');
            const statusEl = document.getElementById('result-status');
            const messageEl = document.getElementById('result-message');

            resultArea.hidden = false;

            // Temporary demo logic – replace with fetch('/api/verify') later
            if (reg && code.length >= 6) {
                statusEl.className = 'result-status success';
                statusEl.textContent = 'Authentic';
                messageEl.textContent = 'This transcript has been verified as genuine and issued by the Academic Registrar.';
            } else {
                statusEl.className = 'result-status fail';
                statusEl.textContent = 'Invalid / Not Found';
                messageEl.textContent = 'No matching record found or the verification code is incorrect. Please check the details and try again.';
            }
        });
    </script>
</body>
</html>
