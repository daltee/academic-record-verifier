<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Access | Transcript Verification</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-shell">
        <main class="portal-card">
            <header class="portal-header">
                <div class="logo-frame">
                          <div class="logo"><img src="MUST Badge.jpeg" alt="MUST logo"></div>

                </div>
                <h1 class="portal-title">MUST Staff Access</h1>
                <p class="portal-subtitle">Academic Registrar — Transcript Issuance</p>
            </header>

            <nav class="tab-headers" aria-label="Portal navigation">
                <a href="index.html" class="tab-link">Verify Transcript</a>
                <a href="signup.html" class="tab-link active">Staff Access</a>
            </nav>

            <section class="form-panel">
                <p class="form-intro">Registrar staff login. After authentication you will be able to issue and manage digitally signed transcripts.</p>

                <form id="staff-login-form" action="#">
                    <div class="form-group">
                        <label for="staff-email">Staff Email / Username</label>
                        <input type="text" id="staff-email" placeholder="Enter your staff email" autocomplete="username" required>
                    </div>

                    <div class="form-group">
                        <label for="staff-password">Password</label>
                        <input type="password" id="staff-password" placeholder="Enter your password" autocomplete="current-password" required>
                    </div>

                    <button type="submit" class="submit-btn">Login as Staff</button>
                </form>
            </section>
        </main>

        <footer class="site-footer">
            &copy; 2026 Group C | SWE2106 — Anti-Forgery Transcript Verification
        </footer>
    </div>
</body>
</html>
